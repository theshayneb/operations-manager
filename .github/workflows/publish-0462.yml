name: Publish Operations Manager 0.4.62
on:
  push:
    paths:
      - '.github/workflows/publish-0462.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.62")process.exit(1)'
          test -s styles.css
          gh release create 0.4.62 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.62 (Beta)" --notes "Restore plain, large Paid and Unpaid headings above invoice cards. Keep collapsible sections and remembered state without outer boxed cards." --prerelease
