name: Publish Operations Manager 0.4.11
on:
  push:
    paths:
      - '.github/workflows/publish-0411.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.11")process.exit(1)'
          test -s styles.css
          gh release create 0.4.11 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.11 (Beta)" --notes "Add multi-select Agreement_Types list allowing Maintenance and Lease simultaneously, plus Software seats and Other. Agreement types editable from dashboard, saved to original note frontmatter." --prerelease
