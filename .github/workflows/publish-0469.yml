name: Publish Operations Manager 0.4.69
on:
  push:
    paths:
      - '.github/workflows/publish-0469.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.69")process.exit(1)'
          test -s styles.css
          gh release create 0.4.69 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.69 (Beta)" --notes "Treat license Cost as the total amount charged each billing cycle without multiplying by License_Seats or dividing by contract length. Estimate whole-term spend from the number of billing periods when possible. No new frontmatter fields required." --prerelease
