name: Publish Operations Manager 0.2.1
on:
  push:
    paths:
      - '.github/workflows/publish-021.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css
          node --check main.js
          node -e 'const m=require("./manifest.json"); if(m.version!=="0.2.1") process.exit(1)'
          gh release create 0.2.1 main.js manifest.json styles.css --target main --title "Operations Manager 0.2.1 (Beta)" --notes "Native formatted Excel XLSX export replaces CSV. Includes command center dashboard and improved alert filtering. Back up your vault before updating." --prerelease
