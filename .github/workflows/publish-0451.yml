name: Publish Operations Manager 0.4.51
on:
  push:
    paths:
      - '.github/workflows/publish-0451.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.51")process.exit(1)'
          test -s styles.css
          gh release create 0.4.51 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.51 (Beta)" --notes "Dashboard device alerts show clickable note title, linked Employee, status, Notes and Update action." --prerelease
