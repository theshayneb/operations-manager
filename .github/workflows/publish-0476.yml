name: Publish Operations Manager 0.4.76
on:
  push:
    paths:
      - '.github/workflows/publish-0476.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.76")process.exit(1)'
          test -s styles.css
          gh release create 0.4.76 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.76 (Beta)" --notes "Fix Nextiva first-time multi-license setup hidden by Settings refactor. Add license types button to Settings and existing license card even before types are configured. Rebuild expandable license details, show diagnostic error message instead of vague inspect-note prompt, and offer a Set contract renewal date modal. Preserve existing notes." --prerelease
