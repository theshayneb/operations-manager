name: Publish Operations Manager 0.4.26
on:
  push:
    paths:
      - '.github/workflows/publish-0426.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.26")process.exit(1)'
          test -s styles.css
          gh release create 0.4.26 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.26 (Beta)" --notes "Dashboard priority colors: red for overdue and within 30 days or low seats; amber #ffae52 for 31-60 days; default otherwise. Honor Seat_Alerts false." --prerelease
