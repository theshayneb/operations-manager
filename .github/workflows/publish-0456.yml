name: Publish Operations Manager 0.4.56
on:
  push:
    paths:
      - '.github/workflows/publish-0456.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.56")process.exit(1)'
          test -s styles.css
          gh release create 0.4.56 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.56 (Beta)" --notes "Refine renewal warning tiers: red through 30 days or fewer than 2 seats, orange 31-60 days or 3-5 seats, yellow #ffeb66 for 61-90 days, and no date-based color beyond 90 days." --prerelease
