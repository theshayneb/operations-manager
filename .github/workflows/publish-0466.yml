name: Publish Operations Manager 0.4.66
on:
  push:
    paths:
      - '.github/workflows/publish-0466.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.66")process.exit(1)'
          test -s styles.css
          gh release create 0.4.66 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.66 (Beta)" --notes "Simplify Dashboard billing display to only the Upcoming charge dollar amount, removing redundant Next charge date and breakdown lines while retaining billing alerts." --prerelease
