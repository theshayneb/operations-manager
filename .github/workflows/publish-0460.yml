name: Publish Operations Manager 0.4.60
on:
  push:
    paths:
      - '.github/workflows/publish-0460.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.60")process.exit(1)'
          test -s styles.css
          gh release create 0.4.60 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.60 (Beta)" --notes "Move license/agreement management into plugin settings; enlarge Licenses & Renewals heading; group Invoices by Paid/Unpaid with sortable cards; group Orders by status." --prerelease
