name: Publish Operations Manager 0.4.67
on:
  push:
    paths:
      - '.github/workflows/publish-0467.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.67")process.exit(1)'
          test -s styles.css
          gh release create 0.4.67 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.67 (Beta)" --notes "Condense Dashboard renewal/license cards by removing duplicate renewal date and countdown, combining renewal and billing costs, and shortening seat counts. Preserve separate billing-first alerts." --prerelease
