name: Publish Operations Manager 0.4.27
on:
  push:
    paths:
      - '.github/workflows/publish-0427.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.27")process.exit(1)'
          test -s styles.css
          gh release create 0.4.27 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.27 (Beta)" --notes "Add per-license Low-seat alerts toggle on Licenses and Renewals management cards, saving Seat_Alerts boolean to existing note without affecting renewals." --prerelease
