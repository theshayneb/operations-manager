name: Publish Operations Manager 0.4.41
on:
  push:
    paths:
      - '.github/workflows/publish-0441.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.41")process.exit(1)'
          test -s styles.css
          gh release create 0.4.41 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.41 (Beta)" --notes "Fix JavaScript regex syntax error that blocked releases; includes Dashboard follow-ups, invoice sorting, alphabetical licenses and complete equipment last." --prerelease
