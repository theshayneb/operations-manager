name: Publish Operations Manager 0.4.8
on:
  push:
    paths:
      - '.github/workflows/publish-048.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.8")process.exit(1)'
          test -s styles.css
          gh release create 0.4.8 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.8 (Beta)" --notes "Derive deployment from populated Set_up date. Remove Deployment_Status dropdown and Deployment_Date from equipment editor and export. Existing notes are not rewritten." --prerelease
