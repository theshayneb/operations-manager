name: Publish Operations Manager 0.3.1
on:
  push:
    paths:
      - '.github/workflows/publish-031.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css
          node --check main.js
          node -e 'const m=require("./manifest.json"); if(m.version!=="0.3.1") process.exit(1)'
          gh release create 0.3.1 main.js manifest.json styles.css --target main --title "Operations Manager 0.3.1 (Beta)" --notes "Ignore Markdown notes inside any folder named Templates, including nested Templates folders, in all Operations Manager views and exports. Keeps project relationships and XLSX export." --prerelease
