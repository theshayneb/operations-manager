name: Publish Operations Manager 0.4.80
on:
  push:
    paths:
      - '.github/workflows/publish-0480.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.80")process.exit(1)'
          test -s styles.css
          gh release create 0.4.80 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.80 (Beta)" --notes "Hide purchased/assigned/available seat counts and empty License details dropdown for agreements not classified as seat-based. Also hide seat alert controls and seat warnings for non-seat agreements. Preserve billing, renewal, and Cost display." --prerelease
