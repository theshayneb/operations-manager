name: Publish Operations Manager 0.4.6
on:
  push:
    paths:
      - '.github/workflows/publish-046.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.6")process.exit(1)'
          test -s styles.css
          gh release create 0.4.6 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.6 (Beta)" --notes "Use Device_Model rather than Model in equipment edit forms and XLSX export. Reads old Model as fallback, but writes Device_Model without rewriting existing notes." --prerelease
