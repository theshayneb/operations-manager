name: Publish Operations Manager 0.4.73
on:
  push:
    paths:
      - '.github/workflows/publish-0473.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.73")process.exit(1)'
          test -s styles.css
          gh release create 0.4.73 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.73 (Beta)" --notes "Per-license Renewal alerts and Upcoming charge alerts toggles, independent of Seat alerts; configurable per-license renewal warning window (including 60 days). Restore Nextiva contract renewal tracking even with monthly billing. Disabled alerts no longer create Dashboard action cards or buttons." --prerelease
