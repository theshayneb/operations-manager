name: Publish Operations Manager 0.4.15
on:
  push:
    paths:
      - '.github/workflows/publish-0415.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.15")process.exit(1)'
          test -s styles.css
          gh release create 0.4.15 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.15 (Beta)" --notes "Automatically fill missing Next_Renewal frontmatter for recognized renewal notes from Ordered plus Renewal days on startup and metadata changes, preserving existing dates and source properties." --prerelease
