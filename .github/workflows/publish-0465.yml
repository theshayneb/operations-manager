name: Publish Operations Manager 0.4.65
on:
  push:
    paths:
      - '.github/workflows/publish-0465.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.65")process.exit(1)'
          test -s styles.css
          gh release create 0.4.65 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.65 (Beta)" --notes "Track Billing cadence and Next_Billing date independently of Renewal and Next_Renewal. Estimate per-charge amount from full-term Cost times License_Seats divided by approximate billing periods; show separate Dashboard charge and contract renewal dates, independent alerts, and a Record charge action. Edit Billing and Next_Billing from plugin settings." --prerelease
