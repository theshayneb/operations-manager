name: Publish Operations Manager 0.4.17
on:
  push:
    paths:
      - '.github/workflows/publish-0417.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.17")process.exit(1)'
          test -s styles.css
          gh release create 0.4.17 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.17 (Beta)" --notes "Support month-to-month agreements (including Nextiva) without renewal expiry alerts or automatic Next_Renewal population; tint overdue Dashboard renewals in mild #fd5858 red." --prerelease
