name: Publish Operations Manager 0.4.78
on:
  push:
    paths:
      - '.github/workflows/publish-0478.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.78")process.exit(1)'
          test -s styles.css
          gh release create 0.4.78 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.78 (Beta)" --notes "Fix missing renderLicenseOverviewInline method in embedded Operations Manager view, which caused license detail cards to display a function-not-found error. Also delegate Orders rendering in embedded tab views. No frontmatter changes." --prerelease
