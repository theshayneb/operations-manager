name: Publish Operations Manager 0.4.30
on:
  push:
    paths:
      - '.github/workflows/publish-0430.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.30")process.exit(1)'
          test -s styles.css
          gh release create 0.4.30 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.30 (Beta)" --notes "Dashboard directly scans Markdown notes for YAML tags containing equip_up and Status other than complete, grouping all matches by Approved phase independently of general record filters." --prerelease
