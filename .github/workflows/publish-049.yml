name: Publish Operations Manager 0.4.9
on:
  push:
    paths:
      - '.github/workflows/publish-049.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.9")process.exit(1)'
          test -s styles.css
          gh release create 0.4.9 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.9 (Beta)" --notes "Rename Update laptop workflow to Update equipment workflow and Laptop model to Device model; use native calendar date inputs for Ordered and Set_up." --prerelease
