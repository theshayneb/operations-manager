name: Publish Operations Manager 0.4.5
on:
  push:
    paths:
      - '.github/workflows/publish-045.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.5")process.exit(1)'
          test -s styles.css
          gh release create 0.4.5 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.5 (Beta)" --notes "Exclude employees with populated Termination_Date from records, suggestions, license assignments and seat counts. Read both checked text and true checkbox values; write boolean true/false for new license assignment edits rather than checked/unchecked text." --prerelease
