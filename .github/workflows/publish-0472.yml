name: Publish Operations Manager 0.4.72
on:
  push:
    paths:
      - '.github/workflows/publish-0472.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.72")process.exit(1)'
          test -s styles.css
          gh release create 0.4.72 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.72 (Beta)" --notes "Fix regression in license card visibility: recognize existing license records from seat, billing and renewal properties as well as tags; correct tab filtering precedence; keep all records visible if one expandable card detail fails." --prerelease
