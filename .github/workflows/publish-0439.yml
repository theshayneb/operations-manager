name: Publish Operations Manager 0.4.39
on:
  push:
    paths:
      - '.github/workflows/publish-0439.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.39")process.exit(1)'
          test -s styles.css
          gh release create 0.4.39 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.39 (Beta)" --notes "Remove project creation and project-link overview from the UI; rename Projects & orders to Orders. Existing project notes remain untouched." --prerelease
