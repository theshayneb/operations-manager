name: Publish Operations Manager 0.3.3
on:
  push:
    paths:
      - '.github/workflows/publish-033.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.3.3")process.exit(1)'
          test -s styles.css
          gh release create 0.3.3 main.js manifest.json styles.css --target main --title "Operations Manager 0.3.3 (Beta)" --notes "Estimate renewal date from existing Ordered date plus Renewal days. Explicit Next_Renewal takes precedence. Estimated dates are labeled, and existing notes remain unchanged. Includes equipment Phase grouping and XLSX export." --prerelease
