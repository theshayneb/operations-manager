name: Publish Operations Manager 0.4.58
on:
  push:
    paths:
      - '.github/workflows/publish-0458.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.58")process.exit(1)'
          test -s styles.css
          gh release create 0.4.58 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.58 (Beta)" --notes "Embed a live Operations Manager dashboard in any Obsidian note using a fenced operations-manager code block. Includes live alerts, cards, actions, tabs and refresh handling." --prerelease
