name: Publish Operations Manager 0.3.5
on:
  push:
    paths:
      - '.github/workflows/publish-035.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.3.5")process.exit(1)'
          test -s styles.css
          gh release create 0.3.5 main.js manifest.json styles.css --target main --title "Operations Manager 0.3.5 (Beta)" --notes "Exclude all notes in Templates, call_notes and meeting_notes folders from operational dashboard, counts, projects and Excel export. Retains renewal completion and phase grouping." --prerelease
