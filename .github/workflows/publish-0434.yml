name: Publish Operations Manager 0.4.34
on:
  push:
    paths:
      - '.github/workflows/publish-0434.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.34")process.exit(1)'
          test -s styles.css
          gh release create 0.4.34 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.34 (Beta)" --notes "Collapsible Dashboard phases, larger cards, note properties, Equipment by Status with filename/employee sort, archive exclusions, phase label cleanup, no order counts, and one Status field." --prerelease
