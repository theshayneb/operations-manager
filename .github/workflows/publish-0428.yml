name: Publish Operations Manager 0.4.28
on:
  push:
    paths:
      - '.github/workflows/publish-0428.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.28")process.exit(1)'
          test -s styles.css
          gh release create 0.4.28 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.28 (Beta)" --notes "Recognize inline and frontmatter equip_up tags, prioritize equipment classification, and show all non-complete equipment on Dashboard grouped by Approved phase." --prerelease
