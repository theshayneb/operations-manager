name: Publish Operations Manager 0.4.84
on:
  push:
    paths:
      - '.github/workflows/publish-0484.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.84")process.exit(1)'
          test -s styles.css
          gh release create 0.4.84 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.84 (Beta)" --notes "Dashboard license cards now show only active, enabled alert events. Each renewal, charge, or seat alert explicitly states what needs action, including days remaining and date for contract/billing, purchased and available counts for seats, and billing amount only for active charges. Remove irrelevant renewal estimates and non-actionable cost information from Dashboard alerts. Each event line has its own alert color." --prerelease
