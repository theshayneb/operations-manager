name: Publish Operations Manager 0.3.6
on:
  push:
    paths:
      - '.github/workflows/publish-036.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.3.6")process.exit(1)'
          test -s styles.css
          gh release create 0.3.6 main.js manifest.json styles.css --target main --title "Operations Manager 0.3.6 (Beta)" --notes "Correctly excludes call_notes and meeting_notes by frontmatter tags, not folder names. Templates folders remain excluded. Includes master project linking, phase grouping, renewal workflows and XLSX export." --prerelease
