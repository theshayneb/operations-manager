name: Attach BRAT release assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/attach-assets.yml'
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload plugin files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css
          gh release upload 0.1.0 main.js manifest.json styles.css --clobber
