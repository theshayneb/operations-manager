name: Publish Operations Manager 0.4.2
on:
  push:
    paths:
      - '.github/workflows/publish-042.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.2")process.exit(1)'
          test -s styles.css
          gh release create 0.4.2 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.2 (Beta)" --notes "Employee-based license seat tracking: count frontmatter values like Foxit: checked; purchased seats via License_Seats, optional License_Field mapping, remaining-seat warnings, assigned-employee lists and direct assignment editing. Removes device-based license assignment UI." --prerelease
