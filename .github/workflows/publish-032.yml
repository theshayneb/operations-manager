name: Publish Operations Manager 0.3.2
on:
  push:
    paths:
      - '.github/workflows/publish-032.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.3.2")process.exit(1)'
          test -s styles.css
          gh release create 0.3.2 main.js manifest.json styles.css --target main --title "Operations Manager 0.3.2 (Beta)" --notes "Equipment tab groups equip_ug notes by Phase frontmatter. Includes existing devices, master projects, and formatted Excel export. Templates folders are ignored." --prerelease
