name: Publish Operations Manager 0.4.13
on:
  push:
    paths:
      - '.github/workflows/publish-0413.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.13")process.exit(1)'
          test -s styles.css
          gh release create 0.4.13 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.13 (Beta)" --notes "Make every license/agreement name a clickable link that opens its original Obsidian note directly from the Licenses & Renewals dashboard." --prerelease
