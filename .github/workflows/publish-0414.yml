name: Publish Operations Manager 0.4.14
on:
  push:
    paths:
      - '.github/workflows/publish-0414.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.14")process.exit(1)'
          test -s styles.css
          gh release create 0.4.14 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.14 (Beta)" --notes "Dashboard shows only action-needed records; equipment alerts require #equip_up and exclude Delivered devices with a valid Set_Up date. Removes equipment inventory from Dashboard. Recognizes printer agreement renewals via Agreement_Types or printer tag plus renewal data and flags missing renewal dates for review." --prerelease
