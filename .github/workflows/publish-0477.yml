name: Publish Operations Manager 0.4.77
on:
  push:
    paths:
      - '.github/workflows/publish-0477.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.77")process.exit(1)'
          test -s styles.css
          gh release create 0.4.77 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.77 (Beta)" --notes "Allow selection of existing employee frontmatter fields for licenses: individual Employee_Field mapping for each multi-type Nextiva license in the license-types editor, and License_Field picker for standard licenses. Seat counts, holders and assignment changes now use the mapped fields (true/checked), without requiring changes to existing employee notes." --prerelease
