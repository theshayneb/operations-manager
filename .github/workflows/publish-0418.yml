name: Publish Operations Manager 0.4.18
on:
  push:
    paths:
      - '.github/workflows/publish-0418.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.18")process.exit(1)'
          test -s styles.css
          gh release create 0.4.18 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.18 (Beta)" --notes "Dashboard #equip_up actions are based on missing Ordered or Set_Up dates, independent of Order_Status; completed dated upgrades stay on Equipment page." --prerelease
