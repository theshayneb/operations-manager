name: Publish Operations Manager 0.4.85
on:
  push:
    paths:
      - '.github/workflows/publish-0485.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.85")process.exit(1)'
          test -s styles.css
          gh release create 0.4.85 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.85 (Beta)" --notes "Make the Paid and Unpaid collapsible groups in the Invoices tab use the same bordered container-card and nested invoice-card styling as Equipment by Status. Preserve invoice sort order, existing invoice information, and Mark paid actions." --prerelease
