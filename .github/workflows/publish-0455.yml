name: Publish Operations Manager 0.4.55
on:
  push:
    paths:
      - '.github/workflows/publish-0455.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.55")process.exit(1)'
          test -s styles.css
          gh release create 0.4.55 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.55 (Beta)" --notes "Renewal card tiers: red 0-30 days or under 2 seats; orange 31-60 days or 2-5 seats; yellow 61+ days. Expanded seat alerts up to 5." --prerelease
