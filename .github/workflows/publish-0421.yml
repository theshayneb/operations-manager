name: Publish Operations Manager 0.4.21
on:
  push:
    paths:
      - '.github/workflows/publish-0421.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.21")process.exit(1)'
          test -s styles.css
          gh release create 0.4.21 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.21 (Beta)" --notes "Dashboard shows all #equip_up notes with Status other than complete, grouped by existing Approved phase. Other action types stay in their own list." --prerelease
