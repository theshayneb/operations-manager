name: Publish Operations Manager 0.4.59
on:
  push:
    paths:
      - '.github/workflows/publish-0459.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.59")process.exit(1)'
          test -s styles.css
          gh release create 0.4.59 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.59 (Beta)" --notes "Larger Licenses and agreements and License seats remaining headings; sort by filename, fewest seats remaining, or soonest renewal; honor disabled low-seat alerts across license lists." --prerelease
