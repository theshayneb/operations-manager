name: Publish Operations Manager 0.4.3
on:
  push:
    paths:
      - '.github/workflows/publish-043.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.3")process.exit(1)'
          test -s styles.css
          gh release create 0.4.3 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.3 (Beta)" --notes "Preserve dashboard scroll position when updating records and refreshing, instead of jumping back to the top." --prerelease
