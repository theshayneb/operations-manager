name: Publish Operations Manager 0.4.86
on:
  push:
    paths:
      - '.github/workflows/publish-0486.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.86")process.exit(1)'
          test -s styles.css
          gh release create 0.4.86 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.86 (Beta)" --notes "Add Excel export options modal: choose original Operations Manager records, all Markdown notes, or any YAML frontmatter tag (such as device, license or person). Tag filtering strictly ignores inline body tags. Optionally export every frontmatter property as dynamic columns while retaining the original formatted export. Matching notes are exported vault-wide, including records not shown by Operations Manager." --prerelease
