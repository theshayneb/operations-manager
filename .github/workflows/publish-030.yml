name: Publish Operations Manager 0.3.0
on:
  push:
    paths:
      - '.github/workflows/publish-030.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css
          node --check main.js
          node -e 'const m=require("./manifest.json"); if(m.version!=="0.3.0") process.exit(1)'
          gh release create 0.3.0 main.js manifest.json styles.css --target main --title "Operations Manager 0.3.0 (Beta)" --notes "Master project creation and linking existing device, license, and order notes. Includes formatted XLSX export and command center dashboard. Experimental: back up vault before updating." --prerelease
