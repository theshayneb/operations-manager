name: Publish Operations Manager 0.4.16
on:
  push:
    paths:
      - '.github/workflows/publish-0416.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.16")process.exit(1)'
          test -s styles.css
          gh release create 0.4.16 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.16 (Beta)" --notes "Show overdue renewals and renewals due within the next 90 days in Dashboard action queue, including existing installs with prior 60-day default." --prerelease
