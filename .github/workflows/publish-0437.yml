name: Publish Operations Manager 0.4.37
on:
  push:
    paths:
      - '.github/workflows/publish-0437.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.37")process.exit(1)'
          test -s styles.css
          gh release create 0.4.37 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.37 (Beta)" --notes "Equipment cards display the YAML Notes property (plural) instead of Note." --prerelease
