name: Publish Operations Manager 0.4.63
on:
  push:
    paths:
      - '.github/workflows/publish-0463.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.63")process.exit(1)'
          test -s styles.css
          gh release create 0.4.63 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.63 (Beta)" --notes "Fix Set Purchased Seats Save in plugin settings: synchronize record data and refresh the settings panel immediately after updating the note." --prerelease
