name: Publish Operations Manager 0.4.68
on:
  push:
    paths:
      - '.github/workflows/publish-0468.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.68")process.exit(1)'
          test -s styles.css
          gh release create 0.4.68 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.68 (Beta)" --notes "Align new invoice and order forms to existing frontmatter conventions: invoice services are stored in Notes, and order approval details including approver/date/phase are stored in Approved. Display both on respective cards. No existing note migration." --prerelease
