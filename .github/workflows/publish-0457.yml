name: Publish Operations Manager 0.4.57
on:
  push:
    paths:
      - '.github/workflows/publish-0457.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.57")process.exit(1)'
          test -s styles.css
          gh release create 0.4.57 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.57 (Beta)" --notes "Show red #fd5858 warning for 2 or fewer available seats in both Dashboard and license inventory." --prerelease
