name: Publish Operations Manager 0.4.70
on:
  push:
    paths:
      - '.github/workflows/publish-0470.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.70")process.exit(1)'
          test -s styles.css
          gh release create 0.4.70 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.70 (Beta)" --notes "Add reusable license overview cards showing purchased, assigned and available seats; billing-cycle total and calculated cost per purchased seat; expandable assigned employee links. Add Nextiva multi-type editor and assignments with monthly totals billed for purchased seats, even when unused." --prerelease
