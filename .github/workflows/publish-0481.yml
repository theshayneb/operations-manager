name: Publish Operations Manager 0.4.81
on:
  push:
    paths:
      - '.github/workflows/publish-0481.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.81")process.exit(1)'
          test -s styles.css
          gh release create 0.4.81 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.81 (Beta)" --notes "Per-license Dashboard alert customization in Settings. Configure critical, warning, and early-notice thresholds and colors independently for renewal dates, upcoming charges and seat availability. Choose red, orange, yellow, green or No alert per tier. Existing thresholds remain defaults; overrides are stored in plugin settings, not note frontmatter. Honors rules in Dashboard cards, actions and event selection." --prerelease
