name: Publish Operations Manager 0.3.4
on:
  push:
    paths:
      - '.github/workflows/publish-034.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.3.4")process.exit(1)'
          test -s styles.css
          gh release create 0.3.4 main.js manifest.json styles.css --target main --title "Operations Manager 0.3.4 (Beta)" --notes "Renewal completion advances next date by term, stores previous renewal in history, preserves Ordered, and appends a Tasks-compatible next-renewal reminder. Variable or missing terms require manual review. Project creation no longer requests owner or target date." --prerelease
