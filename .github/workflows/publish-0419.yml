name: Publish Operations Manager 0.4.19
on:
  push:
    paths:
      - '.github/workflows/publish-0419.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.19")process.exit(1)'
          test -s styles.css
          gh release create 0.4.19 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.19 (Beta)" --notes "Show all unpaid invoices on Dashboard regardless of due date, including invoices with no due date; retain Mark paid action." --prerelease
