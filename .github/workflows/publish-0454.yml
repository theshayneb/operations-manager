name: Publish Operations Manager 0.4.54
on:
  push:
    paths:
      - '.github/workflows/publish-0454.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.54")process.exit(1)'
          test -s styles.css
          gh release create 0.4.54 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.54 (Beta)" --notes "Restore Dashboard renewal dates and days-remaining labels even when a renewal note also has a device tag." --prerelease
