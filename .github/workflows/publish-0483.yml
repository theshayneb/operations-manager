name: Publish Operations Manager 0.4.83
on:
  push:
    paths:
      - '.github/workflows/publish-0483.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.83")process.exit(1)'
          test -s styles.css
          gh release create 0.4.83 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.83 (Beta)" --notes "Fix Dashboard showing a contract renewal warning even when that license has Contract renewals alerts turned off. The second contract-renewal line now respects both the toggle and active alert threshold; renewal estimate line is suppressed when renewal alerts are disabled. Billing and low-seat alerts continue independently." --prerelease
