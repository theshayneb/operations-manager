name: Publish Operations Manager 0.4.31
on:
  push:
    paths:
      - '.github/workflows/publish-0431.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.31")process.exit(1)'
          test -s styles.css
          gh release create 0.4.31 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.31 (Beta)" --notes "Dashboard equipment now requires YAML tag equip_ug instead of equip_up, with Status not complete and grouping by Approved phase." --prerelease
