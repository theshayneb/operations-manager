name: Publish Operations Manager 0.4.29
on:
  push:
    paths:
      - '.github/workflows/publish-0429.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.29")process.exit(1)'
          test -s styles.css
          gh release create 0.4.29 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.29 (Beta)" --notes "Read equip_up exclusively from YAML frontmatter tags, not inline body tags or other metadata. Preserve phase-grouped unfinished equipment Dashboard." --prerelease
