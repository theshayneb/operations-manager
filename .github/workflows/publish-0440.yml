name: Publish Operations Manager 0.4.40
on:
  push:
    paths:
      - '.github/workflows/publish-0440.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.40")process.exit(1)'
          test -s styles.css
          gh release create 0.4.40 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.40 (Beta)" --notes "Complete equipment group last, neutral follow-up Dashboard cards after main alerts, alphabetized licenses, and invoices with Date/Vendor sorting." --prerelease
