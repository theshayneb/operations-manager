name: Publish Operations Manager 0.4.20
on:
  push:
    paths:
      - '.github/workflows/publish-0420.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.20")process.exit(1)'
          test -s styles.css
          gh release create 0.4.20 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.20 (Beta)" --notes "Sort Dashboard renewals oldest overdue to furthest upcoming, with undated actions afterward; Mark paid now writes existing Status: complete and Paid_Date." --prerelease
