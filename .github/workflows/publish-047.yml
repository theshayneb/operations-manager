name: Publish Operations Manager 0.4.7
on:
  push:
    paths:
      - '.github/workflows/publish-047.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.7")process.exit(1)'
          test -s styles.css
          gh release create 0.4.7 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.7 (Beta)" --notes "Use Ordered for equipment order date and Set_up for setup date in forms and XLSX. Legacy Order_Date and Received_Date remain read-only fallbacks." --prerelease
