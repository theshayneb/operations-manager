name: Publish Operations Manager 0.4.61
on:
  push:
    paths:
      - '.github/workflows/publish-0461.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.61")process.exit(1)'
          test -s styles.css
          gh release create 0.4.61 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.61 (Beta)" --notes "Make Unpaid and Paid invoice headings collapsible with remembered state; order status groups Not ordered, In progress, Ordered, Complete, then other statuses." --prerelease
