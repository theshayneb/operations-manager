name: Publish Operations Manager 0.4.71
on:
  push:
    paths:
      - '.github/workflows/publish-0471.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.71")process.exit(1)'
          test -s styles.css
          gh release create 0.4.71 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.71 (Beta)" --notes "Integrate per-vendor license overviews into existing Licenses & Renewals cards as collapsible, state-persistent details. Show seat counts and billing in a compact summary; expand for per-seat rates and assigned employees, including Nextiva license types. Remove duplicate standalone overview cards." --prerelease
