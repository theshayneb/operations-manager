name: Publish Operations Manager 0.4.25
on:
  push:
    paths:
      - '.github/workflows/publish-0425.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.25")process.exit(1)'
          test -s styles.css
          gh release create 0.4.25 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.25 (Beta)" --notes "Seat_Alerts false suppresses low-seat Dashboard alerts while keeping renewal alerts and license seat counts." --prerelease
