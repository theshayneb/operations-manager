name: Publish Operations Manager 0.4.10
on:
  push:
    paths:
      - '.github/workflows/publish-0410.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check main.js
          node -e 'if(require("./manifest.json").version!=="0.4.10")process.exit(1)'
          test -s styles.css
          gh release create 0.4.10 main.js manifest.json styles.css --target main --title "Operations Manager 0.4.10 (Beta)" --notes "Correct Set_Up capitalization and distinguish employee-assigned software seat licenses from printer maintenance, lease and other agreements with no employee requirement." --prerelease
